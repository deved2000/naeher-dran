# Baut die Android-App.
# - Bei jedem Push und Pull-Request: Test-Build, APK als Artefakt zum Herunterladen.
# - Bei einem Tag wie v1.2: signierte APK + PDFs als GitHub-Release.
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.NAEHERDRAN_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signierschlüssel bereitstellen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "NAEHERDRAN_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        env:
          NAEHERDRAN_KEYSTORE_PASSWORD: ${{ secrets.NAEHERDRAN_KEYSTORE_PASSWORD }}
        run: bash gradlew --no-daemon assembleRelease

      - name: APK benennen
        run: |
          name="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/release/app-release.apk "Naeher-dran-${name}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: naeher-dran-apk
          path: Naeher-dran-*.apk

      - name: Python für die PDFs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PDFs erzeugen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pip install reportlab
          python tools/make_pdf.py --out pdf

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Naeher-dran-*.apk
            pdf/*.pdf
